
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원 관리</title>

    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 페이지 제목 -->
    <header>
        <h1>회원 관리</h1>
    </header>

    <main>
        <!-- STEP 04. 클래스 선택자 실습 -->
        <section class="member-card">
            <h2>회원 목록</h2>

            <p>홍길동 | gildong@example.com</p>
            <p>김철수 | chulsoo@example.com</p>
        </section>

        <section class="member-card">
            <h2>회원 등록</h2>

            <form id="signup-form">
                <p>
                    <label for="name">이름</label>
                    <input type="text" id="name" placeholder="이름 입력">
                </p>

                <p>
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="이메일 입력">
                </p>

                <button class="primary-button" type="submit">
                    회원 등록
                </button>
            </form>
        </section>

        <!-- STEP 08. CSS 우선순위 실험 -->
        <section class="member-card">
            <h2>CSS 선택자 테스트</h2>

            <p id="important-message" class="notice">
                회원 정보는 정확히 입력하세요.
            </p>
        </section>
    </main>
</body>
</html>
